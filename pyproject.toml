[project]
name = "brightwheel-photos"
version = "1.0.0"
description = "CLI tool for downloading a student's photos from Brightwheel."
authors = [{name = "Johnathan Gilday", email = "me@johnathangilday.com"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "certifi>=2024.7.4",
    "idna>=3.15",
    "piexif>=1.1.3",
    "Pillow>=10.1.0",
    "requests>=2.31.0",
    "urllib3>=2.7.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
brightwheel-photos = "brightwheel_photos.cli:main"

[dependency-groups]
dev = [
    "black>=23.11.0",
    "pylint>=3.0.3",
    "pytest>=7.4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
